[tox]
envlist = begin,py{37,38,39,310,311,312,313,314},end,format,check,deptry
skip_missing_interpreters = True

[testenv]
changedir = {toxinidir}
package = editable
# This env var is used to enable registry write tests by developers and the
# gitlab action runner.
passenv =
    CASEMENT_TEST_WRITE_ENV
    GITHUB_ACTIONS
skip_install = True
deps =
    -rrequirements.txt
    covdefaults
    coverage
    pytest
commands =
    coverage run -m pytest {posargs:tests/}

[testenv:begin]
labels = fulltest
description = Clean up files generated py previous test runs.
basepython = python3
deps =
    build
    coverage
commands =
    # Ensure the version.py file is created
    python -m build --version

    coverage erase

[testenv:py,py{37,38,39,310,311,312,313,314}]
labels =
    test
    fulltest
description = Run pytest for {envname}
skip_install = False
depends = begin

[testenv:end]
labels = fulltest
description = Generate coverage for previously run tests.
basepython = python3
depends =
    begin
    py{37,38,39,310,311,312,313,314}
deps =
    coverage
parallel_show_output = True
commands =
    coverage combine
    coverage report
    coverage xml

[testenv:format]
description = Run ruff format on the code, (FORMAT_ARGS)
deps = ruff
labels = lint
commands = ruff format {env:FORMAT_ARGS:--exit-non-zero-on-format --check .}

[testenv:check]
description = Run ruff check on the code, (CHECK_ARGS)
deps = ruff
labels = lint
commands = ruff check {env:CHECK_ARGS:.}

[testenv:deptry]
labels = lint
description = Run deptry checks on the code, (DEPTRY_ARGS)
# Only the 0.24.0 version of deptry seems to work when running in tox so py3.11+
basepython = python3.11
deps =
    deptry>=0.24.0
    # Install the packages optional dependencies
    .[dev,pil]
commands =
    python -m deptry {env:DEPTRY_ARGS:.}
